    </filter>
    <linearGradient id="brandGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#1769ff"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
