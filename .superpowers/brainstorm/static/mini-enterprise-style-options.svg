<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1040" viewBox="0 0 1520 1040">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#10233f" flood-opacity=".13"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
